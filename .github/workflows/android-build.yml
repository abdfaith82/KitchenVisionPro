- name: Compile and show Kotlin errors
        run: |
          set +e
          gradle compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee /tmp/compile.log
          STATUS=${PIPESTATUS[0]}
          echo ""
          echo "========== KOTLIN ERRORS (e:) =========="
          grep -E "^e: " /tmp/compile.log || echo "(no e: lines found)"
          echo "========== END ERRORS =========="
          exit $STATUS
